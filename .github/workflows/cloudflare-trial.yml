name: Deploy Cloudflare Pages trial
# Manual only. Publishes the server sign-in build to the separate Cloudflare
# Pages project (https://<project>.pages.dev/IdeaDock/). It never touches the
# official GitHub Pages site. Setup: docs/CLOUDFLARE.md.
on:
  workflow_dispatch:
    inputs:
      branch:
        description: Cloudflare Pages branch (production or a preview name)
        required: true
        default: production
        type: string

permissions:
  contents: read

concurrency:
  group: cloudflare-trial
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: cloudflare-trial
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_PAGES_PROJECT: ${{ vars.CLOUDFLARE_PAGES_PROJECT || 'ideadock' }}
      PAGES_BRANCH: ${{ inputs.branch }}
    steps:
      - name: Require Cloudflare credentials
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ] || [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "Set CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID in the cloudflare-trial environment." >&2
            exit 1
          fi
          case "$PAGES_BRANCH" in
            *[!A-Za-z0-9-]*|"") echo "Invalid branch name" >&2; exit 1 ;;
          esac
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build:cloudflare
      - name: Publish to Cloudflare Pages
        run: >-
          npx --yes wrangler@4.155.0 pages deploy dist-cloudflare
          --project-name "$CLOUDFLARE_PAGES_PROJECT"
          --branch "$PAGES_BRANCH"
