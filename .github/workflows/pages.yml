name: Deploy GitHub Pages
on:
  workflow_run:
    workflows: [IdeaDock CI]
    types: [completed]
    branches: [main]
  workflow_dispatch:
    inputs:
      ci_run_id:
        description: Successful IdeaDock CI run for the current main commit
        required: true
        type: string

permissions:
  contents: read
  actions: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  deploy:
    if: >-
      (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main') ||
      (github.event_name == 'workflow_run' && github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.event == 'push' && github.event.workflow_run.head_branch == 'main' &&
       github.event.workflow_run.head_repository.full_name == github.repository)
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Require successful CI for the current main commit
        id: source
        uses: actions/github-script@v7
        with:
          script: |
            const id = Number(context.eventName === 'workflow_dispatch'
              ? context.payload.inputs.ci_run_id : context.payload.workflow_run.id);
            if (!Number.isSafeInteger(id) || id <= 0) throw new Error('Invalid CI run ID');
            const { data: run } = await github.rest.actions.getWorkflowRun({ ...context.repo, run_id: id });
            const { data: main } = await github.rest.git.getRef({ ...context.repo, ref: 'heads/main' });
            if (run.conclusion !== 'success' || run.event !== 'push' || run.head_branch !== 'main' ||
                run.path !== '.github/workflows/ci.yml' ||
                run.head_repository.full_name.toLowerCase() !== `${context.repo.owner}/${context.repo.repo}`.toLowerCase() ||
                run.head_sha !== main.object.sha) throw new Error('Only the current main commit with successful CI may publish');
            core.setOutput('run_id', String(id));
            core.setOutput('sha', run.head_sha);
      - uses: actions/checkout@v4
        with:
          ref: ${{ steps.source.outputs.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - uses: actions/download-artifact@v4
        with:
          name: static-site
          path: out/
          run-id: ${{ steps.source.outputs.run_id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
      - name: Verify publishable static files and OAuth configuration
        run: node scripts/verify-static.mjs
        env:
          IDEADOCK_PAGES_RELEASE: "1"
          NEXT_PUBLIC_GOOGLE_CLIENT_ID: ${{ vars.NEXT_PUBLIC_GOOGLE_CLIENT_ID }}
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v4
        with:
          path: out/
      - name: Publish the official main site
        id: deployment
        uses: actions/deploy-pages@v4
