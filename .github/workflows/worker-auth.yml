name: Deploy IdeaDock auth Worker (manual)
on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ideadock-auth-staging
  cancel-in-progress: false

jobs:
  deploy:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment:
      name: ideadock-auth-staging
      url: ${{ secrets.APP_ORIGIN }}/IdeaDock/
    env:
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CF_D1_DATABASE_ID: ${{ vars.CF_D1_DATABASE_ID }}
      GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
      GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
      SESSION_ENCRYPTION_KEY: ${{ secrets.SESSION_ENCRYPTION_KEY }}
      APP_ORIGIN: ${{ secrets.APP_ORIGIN }}
      NEXT_PUBLIC_AUTH_MODE: worker
      NEXT_PUBLIC_STORAGE_BACKEND: drive
      NEXT_PUBLIC_GOOGLE_DRIVE_SPACE: drive
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Check staging configuration without printing secrets
        run: |
          node - <<'NODE'
          const required = ["CLOUDFLARE_ACCOUNT_ID","CLOUDFLARE_API_TOKEN","CF_D1_DATABASE_ID","GOOGLE_CLIENT_ID","GOOGLE_CLIENT_SECRET","SESSION_ENCRYPTION_KEY","APP_ORIGIN"];
          for (const name of required) if (!process.env[name]) throw Error("Missing Cloudflare staging configuration: " + name);
          const origin = new URL(process.env.APP_ORIGIN);
          if (origin.protocol !== "https:" || origin.pathname !== "/" || origin.search || origin.hash) throw Error("APP_ORIGIN must be a single HTTPS origin without a path");
          const key = Buffer.from(process.env.SESSION_ENCRYPTION_KEY, "base64");
          if (key.length !== 32) throw Error("SESSION_ENCRYPTION_KEY must decode to exactly 32 bytes");
          const fs = require("node:fs");
          const example = fs.readFileSync("wrangler.example.toml", "utf8");
          fs.writeFileSync("wrangler.toml", example.replace("REPLACE_WITH_D1_DATABASE_ID", process.env.CF_D1_DATABASE_ID), { mode: 0o600 });
          NODE
      - run: npm ci
      - run: npm run preflight
      - run: npm run typecheck
      - run: npm test
      - name: Build dedicated Worker-mode static application
        run: npm run build
      - name: Run D1 schema migrations on the separately provisioned database
        run: npx --yes wrangler@4.164.0 d1 migrations apply ideadock-auth --remote
      - name: Deploy the Worker and its static assets to staging
        run: npx --yes wrangler@4.164.0 deploy
      - name: Set or update Worker-only secrets without printing their values
        run: |
          node - <<'NODE'
          const fs = require("node:fs");
          const keys = ["GOOGLE_CLIENT_ID","GOOGLE_CLIENT_SECRET","SESSION_ENCRYPTION_KEY","APP_ORIGIN"];
          const values = Object.fromEntries(keys.map(key => [key, process.env[key]]));
          fs.writeFileSync("/tmp/ideadock-worker-secrets.json", JSON.stringify(values), { mode: 0o600 });
          NODE
          npx --yes wrangler@4.164.0 secret bulk /tmp/ideadock-worker-secrets.json
          rm -f /tmp/ideadock-worker-secrets.json
      - name: Verify same-origin OAuth API is configured
        run: |
          node - <<'NODE'
          (async () => {
            const base = process.env.APP_ORIGIN.replace(/\/$/, "") + "/IdeaDock/api/auth/session";
            const result = await fetch(base, { redirect: "manual", headers: { Accept: "application/json" } });
            const body = await result.json().catch(() => null);
            if (result.status !== 401 || body?.authenticated !== false) throw Error("Staging OAuth API did not return the expected unauthenticated state");
            console.log("PASS: staging auth endpoint answers securely (401 without a session)");
          })().catch((error) => { console.error(error.message); process.exitCode = 1; });
          NODE
