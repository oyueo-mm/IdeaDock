# Copy to wrangler.toml (ignored by Git), replace the D1 database_id, and deploy manually.
name = "ideadock-auth"
main = "auth-worker/worker.mjs"
compatibility_date = "2026-11-20"
workers_dev = true

[assets]
directory = "./out"
binding = "ASSETS"
html_handling = "none"
run_worker_first = true

[[d1_databases]]
binding = "AUTH_DB"
database_name = "ideadock-auth"
database_id = "REPLACE_WITH_D1_DATABASE_ID"
migrations_dir = "auth-worker/migrations"
